[package]
name = "hutaomu-editor"
version = "0.1.0"
edition = "2021"
description = "Hutaomu Editor - Rust 版本（egui 自绘 UI）"

[dependencies]
# 关闭 accesskit：桌面版无障碍集成存在 request_focus panic（Focused ID not in node list）
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.32"
syntect = { version = "5", default-features = true }
pulldown-cmark = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
dirs = "5"
encoding_rs = "0.8"
image = { version = "0.25", default-features = false, features = ["png","jpeg","gif","bmp","webp"] }
open = "5"
regex = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
pdfium-render = "0.8"

[profile.release]
opt-level = 2
lto = false

[lib]
name = "hutaomu_editor"
path = "src/lib.rs"
